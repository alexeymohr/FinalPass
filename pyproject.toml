[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finalpass"
version = "0.1.0"
description = "Delivery QC CLI for post-production sound."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Alexey Mohr" }]
dependencies = [
    "click>=8.1",
    "jinja2>=3.1.6",
    "numpy>=1.26",
    # Exact Phase 6 pin: pyaaf2 1.7.1 is the latest aged release verified
    # against the 7-day supply-chain hold.
    "pyaaf2==1.7.1",
    # pydantic <2.13 pin: 2.13.x was released in the last 7 days (supply-chain
    # hold). Remove the upper bound after 2026-04-20 when 2.13.x ages in.
    "pydantic>=2.6,<2.13",
    "pyloudnorm>=0.1.1",
    "pyyaml>=6.0",
    "rich>=13.7",
    "scipy>=1.12",
    "soundfile>=0.12.1",
    # Temporary 26.1 hold removed on 2026-04-22 after the release aged past
    # the 7-day supply-chain window and the suite stayed green.
    "packaging>=26.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
finalpass = "finalpass.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/finalpass"]

[tool.hatch.build.targets.wheel.force-include]
"src/finalpass/_bundled_specs" = "finalpass/_bundled_specs"
"src/finalpass/_bundled_patterns.yaml" = "finalpass/_bundled_patterns.yaml"
"src/finalpass/templates" = "finalpass/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
