name: netflix_stereo
display_name: "Netflix Original — stereo (dialog-anchored)"
integrated_lufs:
  target: -27.0
  tolerance: 2.0
dialog_lufs:
  target: -27.0
  tolerance: 2.0
true_peak_max_dbtp: -2.0
lra_max: 18.0
channel_config: "stereo"
notes: |
  Netflix — Sound Mix Specifications & Best Practices v1.6.
  Source: https://partnerhelp.netflixstudios.com/hc/en-us/articles/360001794307
  Average loudness -27 LKFS ±2 LU, dialog-gated. True peak max -2 dBTP.
  Program LRA guidance: 4–18 LU (we enforce the upper bound here; the lower
  bound is not enforced automatically). Provide --dx to check dialog LUFS
  separately.
  Values are current best-public-knowledge targets; not an official platform
  certification. Verify against your current delivery paperwork.
